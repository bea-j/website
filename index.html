<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #eceae4;
      --face: #faf9f6;
      --well: #f1efe9;
      --well-edge: #dedbd3;
      --rec: #e0ddd5;
      --line: #d8d4cc;
      --mid: #8d8880;
      --ink: #1c1c1b;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 13px; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    a { color: var(--ink); text-decoration: none; }

    .app { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; max-width: 560px; margin: 0 auto; padding: 22px 18px; }

    /* header */
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .who { display: flex; flex-direction: column; line-height: 1.45; min-width: 0; }
    .who b { font-size: 15px; font-weight: 700; letter-spacing: 2px; white-space: nowrap; }
    .who span { font-size: 10.5px; color: var(--mid); letter-spacing: 1.2px; white-space: nowrap; }
    .transport { display: flex; gap: 8px; align-items: center; flex: none; }
    .tbtn { border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--ink); background: var(--face); box-shadow: 0 1.5px 0 rgba(28,28,27,.3); }
    .tbtn:active { transform: translateY(1px); box-shadow: 0 0.5px 0 rgba(28,28,27,.3); }
    .tbtn.play { width: 34px; height: 34px; }
    .tbtn.stop { width: 26px; height: 26px; }
    .tbtn svg { width: 11px; height: 11px; fill: var(--ink); }
    .tbtn.stop svg { width: 8px; height: 8px; }
    .tbtn.play.on { background: var(--ink); }
    .tbtn.play.on svg { fill: var(--face); }
    .tbtn.play.pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 1.5px 0 rgba(28,28,27,.3), 0 0 0 5px rgba(28,28,27,.08); } }

    /* chassis */
    .chassis { background: var(--face); border: 1px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 rgba(28,28,27,.25), inset 0 1px 0 #fff; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 13px; border-bottom: 1px solid var(--line); }
    .apron { height: 12px; background: var(--rec); border-top: 1px solid var(--ink); }

    /* plate (the link) */
    .plate { flex: 1.5; min-width: 0; background: #fff; border: 1px solid var(--ink); border-radius: 5px; padding: 5px; box-shadow: 0 3px 0 rgba(28,28,27,.28); transition: transform .06s, box-shadow .06s; }
    .plate .inner { position: relative; display: flex; align-items: center; justify-content: center; min-height: 40px; border: 1px solid var(--line); border-radius: 3px; padding: 6px 14px 6px 8px; font-size: 15px; font-weight: 700; letter-spacing: 2px; text-align: center; white-space: nowrap; }
    .plate .inner i { position: absolute; top: 3px; right: 5px; font-style: normal; font-size: 9px; color: var(--mid); opacity: 0; transition: opacity .12s; }
    .plate:hover .inner, .plate:focus-visible .inner { border-color: var(--ink); }
    .plate:hover .inner i, .plate:focus-visible .inner i { opacity: 1; }
    .plate:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(28,28,27,.28); }

    /* hardware well */
    .well { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--well); border: 1px solid var(--well-edge); border-radius: 6px; box-shadow: inset 0 1.5px 3px rgba(28,28,27,.1); padding: 12px 12px; }
    .knob { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1px solid var(--ink); position: relative; cursor: ns-resize; touch-action: none; background: radial-gradient(circle at 42% 36%, #fff, var(--face) 62%, #e8e5de); box-shadow: 0 1px 1px rgba(28,28,27,.3); }
    .knob i { position: absolute; left: 50%; top: 2px; width: 1.5px; height: 6px; margin-left: -0.75px; background: var(--ink); transform: rotate(var(--rot, 0deg)); transform-origin: 0.75px 8px; }
    .mute { width: 13px; height: 10px; flex: none; border-radius: 2px; border: 1px solid var(--ink); background: linear-gradient(var(--face), #e9e6df); box-shadow: 0 1px 0 rgba(28,28,27,.3); }
    .mute.on { background: var(--ink); }
    .fader { position: relative; flex: 1; max-width: 120px; height: 20px; cursor: ew-resize; touch-action: none; }
    .fader .tick { position: absolute; bottom: 100%; margin-bottom: 1px; width: 1px; }
    .fader::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; background: var(--rec); border-radius: 3px; box-shadow: inset 0 1.5px 2px rgba(28,28,27,.4); }
    .fader::after { content: ""; position: absolute; left: 3px; right: 3px; top: 50%; height: 1px; background: var(--ink); }
    .fader .cap { position: absolute; left: 50%; top: 50%; width: 12px; height: 20px; margin: -10px 0 0 -6px; border: 1px solid var(--ink); border-radius: 2px; background: linear-gradient(90deg, var(--face), #e3e0d9); box-shadow: 0 1.5px 1.5px rgba(28,28,27,.35); z-index: 1; }
    .fader .cap::after { content: ""; position: absolute; top: 4px; bottom: 4px; left: 50%; width: 1.5px; margin-left: -0.75px; background: var(--ink); }

    /* footer */
    .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; font-size: 9px; color: var(--mid); letter-spacing: 1.5px; }
    .foot button { font-size: 9px; letter-spacing: 1.5px; color: var(--mid); border-bottom: 1px solid var(--line); padding-bottom: 1px; }
    .foot button:hover { color: var(--ink); border-color: var(--ink); }
    .mvol { display: flex; align-items: center; gap: 7px; }
    input[type=range].vol { -webkit-appearance: none; appearance: none; width: 74px; height: 12px; background: transparent; cursor: pointer; }
    input[type=range].vol::-webkit-slider-runnable-track { height: 1px; background: var(--mid); }
    input[type=range].vol::-moz-range-track { height: 1px; background: var(--mid); }
    input[type=range].vol::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; margin-top: -4px; border-radius: 50%; background: var(--ink); border: 0; }
    input[type=range].vol::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); border: 0; }

    /* about overlay */
    .about-bg { position: fixed; inset: 0; background: rgba(28,28,27,.3); display: none; place-items: center; z-index: 10; padding: 18px; }
    .about-bg.open { display: grid; }
    .about { max-width: 440px; max-height: 84vh; overflow-y: auto; background: var(--face); border: 1px solid var(--ink); border-radius: 12px; padding: 22px 24px; line-height: 1.7; font-size: 12px; }
    .about h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 1px; }
    .about p { margin: 0 0 10px; }
    .about ul { margin: 0 0 10px; padding-left: 16px; }
    .about li { margin-bottom: 6px; }
    .about .x { float: right; font-size: 18px; color: var(--mid); line-height: 1; }
    .about .x:hover { color: var(--ink); }

    @media (min-width: 700px) {
      .app { max-width: 650px; }
      .who b { font-size: 19px; }
      .who span { font-size: 11.5px; }
      .tbtn.play { width: 40px; height: 40px; }
      .tbtn.stop { width: 30px; height: 30px; }
      .tbtn svg { width: 13px; height: 13px; }
      .tbtn.stop svg { width: 9px; height: 9px; }
      .row { gap: 14px; padding: 14px 15px; }
      .plate .inner { font-size: 17px; min-height: 48px; }
      .well { gap: 14px; padding: 14px; }
      .knob { width: 23px; height: 23px; }
      .knob i { height: 7px; transform-origin: 0.75px 9.5px; }
      .mute { width: 15px; height: 11px; }
      .fader { max-width: 150px; height: 22px; }
      .fader .cap { width: 13px; height: 22px; margin: -11px 0 0 -6.5px; }
      .foot { font-size: 10px; margin-top: 16px; }
      .foot button { font-size: 10px; }
      input[type=range].vol { width: 86px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tbtn.play.pulse { animation: none; }
      .plate, .tbtn { transition: none; }
    }
    @media (max-width: 480px) {
      .app { padding: 14px 10px; }
      .row { gap: 8px; padding: 10px 9px; }
      .plate { flex: 1.35; }
      .plate .inner { font-size: 11.5px; letter-spacing: 1px; min-height: 36px; padding: 5px 12px 5px 6px; }
      .well { gap: 9px; padding: 10px 9px; }
      .who b { font-size: 14.5px; letter-spacing: 1.5px; }
      .who span { font-size: 9px; }
      .foot { flex-wrap: wrap; row-gap: 6px; }
    }
  </style>
</head>

  <div class="app">
    <header class="top">

id)">D</s></span><span style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"><span style="position:relative;width:100%;height:52px;border-bottom:1px solid var(--line)"><i style="position:absolute;left:50%;bottom:37%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ink);"></i></span><b style="font-size:10px">T</b><u style="text-decoration:none;font-size:8px;color:var(--mid)">20</u><s style="text-decoration:none;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:8.5px;color:var(--mid)">B</s></span><span style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"><span style="position:relative;width:100%;height:52px;border-bottom:1px solid var(--line)"><i style="position:absolute;left:50%;bottom:26%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ink);"></i></span><b style="font-size:10px">R</b><u style="text-decoration:none;font-size:8px;color:var(--mid)">18</u><s style="text-decoration:none;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:8.5px;color:var(--mid)">G</s></span><span style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"><span style="position:relative;width:100%;height:52px;border-bottom:1px solid var(--line)"><i style="position:absolute;left:50%;bottom:55%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);box-sizing:border-box;"></i></span><b style="font-size:10px">I</b><u style="text-decoration:none;font-size:8px;color:var(--mid)">9</u><s style="text-decoration:none;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:8.5px;color:var(--mid)">E</s></span><span style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"><span style="position:relative;width:100%;height:52px;border-bottom:1px solid var(--line)"><i style="position:absolute;left:50%;bottom:20%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ink);"></i></span><b style="font-size:10px">C</b><u style="text-decoration:none;font-size:8px;color:var(--mid)">3</u><s style="text-decoration:none;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:8.5px;color:var(--mid)">F&#9839;</s></span><span style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"><span style="position:relative;width:100%;height:52px;border-bottom:1px solid var(--line)"><i style="position:absolute;left:50%;bottom:72%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);box-sizing:border-box;"></i></span><b style="font-size:10px">E</b><u style="text-decoration:none;font-size:8px;color:var(--mid)">5</u><s style="text-decoration:none;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:8.5px;color:var(--mid)">A</s></span><span style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"><span style="position:relative;width:100%;height:52px;border-bottom:1px solid var(--line)"><i style="position:absolute;left:50%;bottom:20%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ink);"></i></span><b style="font-size:10px">J</b><u style="text-decoration:none;font-size:8px;color:var(--mid)">10</u><s style="text-decoration:none;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:8.5px;color:var(--mid)">F&#9839;</s></span><span style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0"><span style="position:relative;width:100%;height:52px;border-bottom:1px solid var(--line)"><i style="position:absolute;left:50%;bottom:55%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);box-sizing:border-box;"></i></span><b style="font-size:10px">I</b><u style="text-decoration:none;font-size:8px;color:var(--mid)">9</u><s style="te   <script>
  (function () {
    var STRIPS = [
      { id: "resume",   label: "RESUME",         voice: "keys",  href: "https://drive.google.com/file/d/15VmttZTTSqz11dAK5_kffS83bzNz40QA/view?usp=sharing" },
      { id: "linkedin", label: "LINKEDIN",       voice: "pulse", href: "https://www.linkedin.com/in/beatrice-jiang" },
      { id: "scholar",  label: "GOOGLE SCHOLAR", voice: "pad",   href: "https://scholar.google.com/citations?user=cETi7YUAAAAJ&hl=en" },
      { id: "email",    label: "EMAIL",          voice: "drone", href: "mailto:beajiang@mit.edu", mail: true }
    ];

    // ---------- music ----------
    var BPM = 104, STEP = 60 / BPM / 2, BARLEN = STEP * 16;
    var MAJ = [0, 2, 4, 5, 7, 9, 11], ROOT = 50; // D3
    function pos(c) { return c.charCodeAt(0) - 64; }
    function deg(c) { return (pos(c) - 1) % 7; }
    function sn(d) { return MAJ[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7); }
    function euclid(k, n) { var a = []; for (var i = 0; i < n; i++) a.push(((i * k) % n) < k); return a; }
    function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    var ROOT_DEG = "BEATRICE".split("").map(deg);
    function chord(bar) { var d = ROOT_DEG[bar % 8]; return [d, d + 2, d + 4, d + 7].map(function (x) { return ROOT + sn(x); }); }
    function rootLow(bar) { return ROOT - 12 + sn(ROOT_DEG[bar % 8]); }
    var PULSE = euclid(5, 16);
    var NAME = "BEATRICEJIANG", MEL_HITS = euclid(13, 32), MEL = new Array(32).fill(null);
    (function () {
      var n = 0;
      for (var i = 0; i < 32; i++) if (MEL_HITS[i]) {
        var c = NAME[n++];
        MEL[i] = ROOT + 12 + sn(deg(c)) + ("AEIOU".indexOf(c) >= 0 ? 12 : 0);
      }
    })();
    var AUTO = "JIANG".split("").map(function (c) { return pos(c) / 14; });
    function autoAt(barF) {
      var seg = Math.min(3.9999, Math.max(0, (barF % 32) / 8)), k = Math.floor(seg), f = seg - k;
      var w = (1 - Math.cos(Math.PI * f)) / 2;
      return AUTO[k] + (AUTO[k + 1] - AUTO[k]) * w;
    }

    // ---------- state ----------
    var state = STRIPS.map(function () { return { vol: 0.8, pan: 0, mute: false }; });
    var masterVol = 0.8;

    // ---------- audio ----------
    var ctx = null, master = null, nodes = {}, noiseBuf = null, drone = null, verbIn = null, padFilter = null;
    var playing = false, curStep = 0, nextTime = 0, timer = null;
    function gainOf(v) { return Math.pow(v / 0.8, 2); }

    function initAudio() {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      var comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 2.2;
